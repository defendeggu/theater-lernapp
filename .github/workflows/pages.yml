name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: node --test test/*.test.mjs
      - run: python -m pytest -q test
      # Sicherheitsnetz: kein Klartext aus dem Stück im Repo
      - name: Keine privaten Dateien im Repo
        run: |
          if git ls-files | grep -E '^(input/|data/private/)|\.pdf$|stueck\.json$|ablauf\.json$'; then
            echo "Private Dateien im Repo!"; exit 1
          fi

  deploy:
    # GitHub Pages braucht bei Gratis-Konten ein öffentliches Repo
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
